<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traditional Craft Categories – LifeTrace Uganda</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color:var(--slate-50);">
  <div id="navbar-placeholder"></div>

  <!-- Header Banner -->
  <section style="background:var(--navy-900);color:var(--white);padding:50px 0 40px;border-bottom:3px solid var(--teal-600);">
    <div class="container" style="text-align:center;max-width:850px;">
      <span class="badge" style="background:var(--teal-600);color:white;margin-bottom:12px;"><i class="fas fa-layer-group"></i> Indigenous Disciplines</span>
      <h1 style="font-size:2.5rem;font-weight:900;color:var(--white);margin-bottom:12px;">Ugandan Traditional Craft Categories</h1>
      <p style="font-size:1.1rem;color:var(--slate-300);line-height:1.6;">
        Explore Ugandan crafts and local practical skills, from basket making and pottery to barkcloth and beadwork.
      </p>
    </div>
  </section>

  <!-- Categories Showcase Grid -->
  <div class="container" style="padding:60px 20px;">
    <div class="category-grid" id="all-categories-grid">
      <div style="text-align:center;padding:50px 0;grid-column:1/-1;">
        <i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--teal-600);"></i>
        <div style="margin-top:12px;color:var(--slate-600);">Loading craft categories...</div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await api.get('/categories');
        const grid = document.getElementById('all-categories-grid');
        if (res.success && res.categories) {
          grid.innerHTML = res.categories.map(c => `
            <div class="card category-page-card" style="overflow:hidden;display:flex;flex-direction:column;transition:var(--transition);border:1px solid var(--slate-200);">
              <div style="height:190px;overflow:hidden;position:relative;">
                <img src="${c.image_url || categoryImageFor(c)}" alt="${c.name} craft illustration" style="width:100%;height:100%;object-fit:cover;" loading="lazy">
                <div style="position:absolute;top:12px;left:12px;">
                  <span class="badge" style="background:rgba(15,23,42,0.85);color:#FBBF24;backdrop-filter:blur(4px);"><i class="fas ${c.icon || 'fa-tools'}"></i> Domain</span>
                </div>
                <div style="position:absolute;bottom:12px;right:12px;">
                  <span class="badge badge-published">${c.published_records_count || 0} Guides</span>
                </div>
              </div>
              <div style="padding:24px;flex:1;display:flex;flex-direction:column;justify-content:space-between;">
                <div>
                  <h2 style="font-size:1.3rem;font-weight:800;color:var(--navy-900);margin-bottom:8px;">${c.name}</h2>
                  <p style="font-size:0.9rem;color:var(--slate-600);line-height:1.6;margin-bottom:20px;">${c.description || 'Traditional artisanal techniques handed down through generations.'}</p>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--slate-100);padding-top:16px;">
                  <span style="font-size:0.85rem;color:var(--slate-500);"><i class="fas fa-book-open text-teal"></i> Explore tutorials</span>
                  <a href="/knowledge-library.html?category=${c.slug}" class="btn btn-teal btn-sm">
                    Browse Crafts <i class="fas fa-arrow-right"></i>
                  </a>
                </div>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error('Failed to load categories:', err);
      }
    });
  </script>
</body>
</html>
