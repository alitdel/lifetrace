<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastery Assessment – LifeTrace Uganda</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color:var(--slate-50);">
  <div id="navbar-placeholder"></div>

  <!-- Header -->
  <section style="background:var(--navy-900);color:var(--white);padding:40px 0 30px;border-bottom:3px solid var(--gold-500);">
    <div class="container">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
        <div>
          <span class="badge" style="background:var(--gold-500);color:var(--navy-950);margin-bottom:8px;">Competency Evaluation</span>
          <h1 style="font-size:2rem;font-weight:800;color:var(--white);" id="as-title">Practical Mastery Assessment</h1>
          <p style="color:var(--slate-300);font-size:0.95rem;margin-top:4px;" id="as-desc">
            Answer the safety, hydraulic, electrical, and procedural mastery questions below.
          </p>
        </div>

        <div style="background:rgba(255,255,255,0.1);padding:12px 20px;border-radius:var(--radius-md);text-align:right;">
          <div style="font-size:0.75rem;text-transform:uppercase;color:var(--slate-400);font-weight:700;">Passing Threshold</div>
          <div style="font-size:1.4rem;font-weight:800;color:var(--teal-400);" id="as-passing-score">75%</div>
        </div>
      </div>
    </div>
  </section>

  <div class="container" style="max-width:860px;padding:40px 20px;">
    <!-- Result Banner (Shown after submission) -->
    <div id="as-result-banner" style="display:none;margin-bottom:30px;"></div>

    <!-- Questions Form -->
    <form id="assessment-form">
      <div id="as-questions-container" style="display:flex;flex-direction:column;gap:20px;margin-bottom:30px;">
        <div style="text-align:center;padding:50px 0;"><i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--teal-600);"></i></div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid #e2e8f0;">
        <a href="/knowledge-library.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Return to Library</a>
        <button type="submit" id="btn-submit-assessment" class="btn btn-teal btn-lg">
          <i class="fas fa-check-circle"></i> Submit Assessment for Grading
        </button>
      </div>
    </form>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let assessmentId = null;
    let questionsData = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      assessmentId = urlParams.get('id');
      const knowledgeId = urlParams.get('knowledge_id');

      if (!assessmentId && !knowledgeId) {
        api.toast('No assessment specified.', 'error');
        setTimeout(() => window.location.href = '/knowledge-library.html', 1000);
        return;
      }

      await loadAssessment(assessmentId, knowledgeId);
    });

    async function loadAssessment(aId, kId) {
      try {
        let res;
        if (aId) {
          // If we have an assessment ID, find through knowledge
          res = await api.get(`/assessments/knowledge/${aId}`).catch(() => null);
        }
        if (!res || !res.hasAssessment) {
          res = await api.get(`/assessments/knowledge/${kId || aId}`);
        }

        if (!res || !res.hasAssessment) {
          document.getElementById('as-questions-container').innerHTML = `
            <div class="card" style="text-align:center;padding:50px 20px;">
              <h3 style="color:var(--navy-900);">No active assessment configured for this module.</h3>
              <p style="color:var(--slate-600);margin:10px 0 20px;">This practical module is self-paced or undergoing assessment authoring.</p>
              <a href="/knowledge-library.html" class="btn btn-teal">Back to Library</a>
            </div>
          `;
          document.getElementById('btn-submit-assessment').style.display = 'none';
          return;
        }

        const a = res.assessment;
        assessmentId = a.id;
        document.getElementById('as-title').textContent = a.title;
        document.getElementById('as-desc').textContent = a.description || 'Answer all questions to qualify for practical certification.';
        document.getElementById('as-passing-score').textContent = `${a.passing_score}%`;

        questionsData = a.questions || [];
        const container = document.getElementById('as-questions-container');

        container.innerHTML = questionsData.map((q, idx) => `
          <div class="card" style="padding:24px;" id="q-card-${q.id}">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <span class="badge" style="background:var(--slate-100);color:var(--slate-700);font-weight:700;">Question ${idx + 1}</span>
              <span style="font-size:0.8rem;color:var(--slate-500);font-weight:600;">${q.points} Points</span>
            </div>

            <div style="font-size:1.05rem;font-weight:700;color:var(--navy-900);margin-bottom:16px;">
              ${q.question_text}
            </div>

            <div style="display:flex;flex-direction:column;gap:10px;" id="options-group-${q.id}">
              ${q.options.map((opt, oIdx) => `
                <label style="display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid #e2e8f0;border-radius:var(--radius-md);cursor:pointer;background:var(--slate-50);transition:var(--transition);" onmouseover="this.style.borderColor='var(--teal-500)'" onmouseout="this.style.borderColor='#e2e8f0'">
                  <input type="radio" name="question_${q.id}" value="${opt.replace(/"/g, '&quot;')}" required style="accent-color:var(--teal-600);width:18px;height:18px;">
                  <span style="font-size:0.92rem;color:var(--slate-800);">${opt}</span>
                </label>
              `).join('')}
            </div>

            <!-- Injected explanation after grading -->
            <div id="q-explanation-${q.id}" style="display:none;margin-top:14px;padding:12px;border-radius:var(--radius-md);font-size:0.88rem;"></div>
          </div>
        `).join('');
      } catch (err) {
        api.toast(err.message, 'error');
      }
    }

    document.getElementById('assessment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit-assessment');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Grading Assessment...';

      const answers = {};
      questionsData.forEach(q => {
        const selected = document.querySelector(`input[name="question_${q.id}"]:checked`);
        if (selected) {
          answers[q.id] = selected.value;
        }
      });

      try {
        const res = await api.post(`/assessments/${assessmentId}/submit`, { answers });
        
        // Show result banner
        const banner = document.getElementById('as-result-banner');
        banner.style.display = 'block';
        banner.scrollIntoView({ behavior: 'smooth' });

        if (res.passed) {
          banner.innerHTML = `
            <div class="card" style="padding:28px;background:var(--emerald-100);border:2px solid var(--emerald-600);text-align:center;">
              <i class="fas fa-award" style="font-size:3rem;color:var(--emerald-600);margin-bottom:12px;"></i>
              <h2 style="font-size:1.8rem;font-weight:800;color:var(--emerald-600);">Congratulations! You Passed!</h2>
              <p style="font-size:1.1rem;color:var(--slate-800);margin:8px 0 16px;">
                You scored <strong>${res.score} / ${res.totalPoints} points (${res.percentage}%)</strong>. Passing score: ${res.passing_score}%.
              </p>
              ${res.certificate ? `
                <div style="margin-top:16px;">
                  <a href="${res.certificate.verification_url}" class="btn btn-gold btn-lg"><i class="fas fa-certificate"></i> View & Print Your Verified Certificate</a>
                </div>
              ` : `
                <p style="font-size:0.85rem;color:var(--slate-600);">If you have completed 100% of the practical steps, your certificate is ready in your profile.</p>
              `}
            </div>
          `;
        } else {
          banner.innerHTML = `
            <div class="card" style="padding:28px;background:var(--rose-100);border:2px solid var(--rose-600);text-align:center;">
              <i class="fas fa-times-circle" style="font-size:3rem;color:var(--rose-600);margin-bottom:12px;"></i>
              <h2 style="font-size:1.8rem;font-weight:800;color:var(--rose-600);">Assessment Score: ${res.percentage}%</h2>
              <p style="font-size:1rem;color:var(--slate-800);margin:8px 0 14px;">
                You needed at least <strong>${res.passing_score}%</strong> to qualify for practical certification. Review the step-by-step procedures and retry.
              </p>
              <button class="btn btn-outline" onclick="window.location.reload()"><i class="fas fa-redo"></i> Retry Assessment</button>
            </div>
          `;
        }

        // Show per-question breakdown and explanations
        if (res.questions) {
          res.questions.forEach(q => {
            const expBox = document.getElementById(`q-explanation-${q.id}`);
            if (expBox) {
              expBox.style.display = 'block';
              if (q.isCorrect) {
                expBox.style.background = 'var(--emerald-100)';
                expBox.style.color = 'var(--emerald-600)';
                expBox.innerHTML = `<strong><i class="fas fa-check-circle"></i> Correct! (+${q.pointsAwarded} pts)</strong><div style="margin-top:4px;color:#0f172a;">${q.explanation || ''}</div>`;
              } else {
                expBox.style.background = 'var(--rose-100)';
                expBox.style.color = 'var(--rose-600)';
                expBox.innerHTML = `<strong><i class="fas fa-times-circle"></i> Incorrect.</strong> Correct answer: <em>"${q.correct_answer}"</em><div style="margin-top:4px;color:#0f172a;">${q.explanation || ''}</div>`;
              }
            }
          });
        }

        btn.style.display = 'none';
      } catch (err) {
        api.toast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle"></i> Submit Assessment for Grading';
      }
    });
  </script>
</body>
</html>
