<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">

  <defs>
    <linearGradient id="weaveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#weaveBg)"/>
  
  <!-- Weaving Loom and Interlaced Reeds -->
  <g transform="translate(400, 220)">
    <rect x="-240" y="-120" width="480" height="240" rx="12" fill="#78350F" stroke="#FDE68A" stroke-width="4"/>
    <!-- Warp and Weft Lines -->
    <line x1="-200" y1="-100" x2="-200" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="-180" y1="-100" x2="-180" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="-160" y1="-100" x2="-160" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="-140" y1="-100" x2="-140" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="-120" y1="-100" x2="-120" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="-100" y1="-100" x2="-100" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="-80" y1="-100" x2="-80" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="-60" y1="-100" x2="-60" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="-40" y1="-100" x2="-40" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="-20" y1="-100" x2="-20" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="0" y1="-100" x2="0" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="20" y1="-100" x2="20" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="40" y1="-100" x2="40" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="60" y1="-100" x2="60" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="80" y1="-100" x2="80" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="100" y1="-100" x2="100" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="120" y1="-100" x2="120" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="140" y1="-100" x2="140" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="160" y1="-100" x2="160" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="180" y1="-100" x2="180" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="200" y1="-100" x2="200" y2="100" stroke="#FEF3C7" stroke-width="2.5" opacity="0.75"/><line x1="-220" y1="-80" x2="220" y2="-80" stroke="#F59E0B" stroke-width="3" opacity="0.85"/><line x1="-220" y1="-60" x2="220" y2="-60" stroke="#F59E0B" stroke-width="3" opacity="0.85"/><line x1="-220" y1="-40" x2="220" y2="-40" stroke="#F59E0B" stroke-width="3" opacity="0.85"/><line x1="-220" y1="-20" x2="220" y2="-20" stroke="#F59E0B" stroke-width="3" opacity="0.85"/><line x1="-220" y1="0" x2="220" y2="0" stroke="#F59E0B" stroke-width="3" opacity="0.85"/><line x1="-220" y1="20" x2="220" y2="20" stroke="#F59E0B" stroke-width="3" opacity="0.85"/><line x1="-220" y1="40" x2="220" y2="40" stroke="#F59E0B" stroke-width="3" opacity="0.85"/><line x1="-220" y1="60" x2="220" y2="60" stroke="#F59E0B" stroke-width="3" opacity="0.85"/><line x1="-220" y1="80" x2="220" y2="80" stroke="#F59E0B" stroke-width="3" opacity="0.85"/>
    <!-- Weaving shuttle -->
    <path d="M -120 -30 C -80 -45, 80 -45, 120 -30 C 80 -15, -80 -15, -120 -30 Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="0" cy="-30" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="40" y="380" width="390" height="80" rx="12" fill="rgba(15,23,42,0.85)" stroke="rgba(20,184,166,0.5)" stroke-width="1.5"/>
  <text x="60" y="414" fill="#2DD4BF" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="1">SISAL & FIBRE CRAFT</text>
  <text x="60" y="442" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800">Traditional Weaving (Okuluka)</text>

</svg>