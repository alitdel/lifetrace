<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – LifeTrace Uganda</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color:var(--slate-100);">
  <div id="navbar-placeholder"></div>

  <div class="container" style="max-width:480px;padding:60px 20px;">
    <div class="card" style="padding:40px;box-shadow:var(--shadow-lg);">
      <div style="text-align:center;margin-bottom:28px;">
        <div class="brand-icon" style="margin:0 auto 12px;width:52px;height:52px;font-size:1.5rem;">
          <i class="fas fa-lock"></i>
        </div>
        <h1 style="font-size:1.8rem;font-weight:800;color:var(--navy-900);">Sign In to LifeTrace</h1>
        <p style="font-size:0.92rem;color:var(--slate-600);margin-top:6px;">
          Access your personalized vocational learning or expert studio.
        </p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username or Email <span class="req">*</span></label>
          <div style="position:relative;">
            <i class="fas fa-user" style="position:absolute;left:14px;top:13px;color:var(--slate-400);"></i>
            <input type="text" id="username" class="form-control" style="padding-left:38px;" placeholder="Username or email" autocomplete="username" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password <span class="req">*</span></label>
          <div style="position:relative;">
            <i class="fas fa-lock" style="position:absolute;left:14px;top:13px;color:var(--slate-400);"></i>
            <input type="password" id="password" class="form-control" style="padding-left:38px;padding-right:48px;" placeholder="Your password" autocomplete="current-password" required>
            <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password" aria-pressed="false"><i class="fas fa-eye" aria-hidden="true"></i></button>
          </div>
        </div>

        <button type="submit" id="btn-login" class="btn btn-teal btn-lg" style="width:100%;margin-top:10px;">
          <i class="fas fa-sign-in-alt"></i> Sign In to Dashboard
        </button>
      </form>

      <div style="text-align:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--slate-200);font-size:0.9rem;color:var(--slate-600);">
        Don't have an account yet? <a href="/register.html" style="font-weight:700;color:var(--teal-600);">Register here</a>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    function togglePasswordVisibility(inputId, button) {
      const input = document.getElementById(inputId);
      const visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      button.setAttribute('aria-pressed', String(visible));
      button.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
      button.innerHTML = `<i class="fas fa-${visible ? 'eye-slash' : 'eye'}" aria-hidden="true"></i>`;
    }

    document.querySelectorAll('[data-password-toggle]').forEach((button) => {
      button.addEventListener('click', () => togglePasswordVisibility(button.dataset.passwordToggle, button));
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await api.post('/auth/login', { username, password });
        api.toast(res.message || 'Login successful!', 'success');
        
        // Redirect to dashboard
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 500);
      } catch (err) {
        api.toast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
