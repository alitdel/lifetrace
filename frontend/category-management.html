<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Registry – LifeTrace Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color:var(--slate-50);">
  <div id="navbar-placeholder"></div>

  <!-- Header -->
  <section style="background:var(--navy-900);color:var(--white);padding:40px 0 30px;border-bottom:3px solid var(--teal-600);">
    <div class="container">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
        <div>
          <span class="badge" style="background:var(--teal-600);color:white;margin-bottom:8px;">Classification Standard</span>
          <h1 style="font-size:2rem;font-weight:800;color:var(--white);">Practical Knowledge Domains</h1>
          <p style="color:var(--slate-300);font-size:1rem;margin-top:4px;">
            Manage and maintain vocational trade categories, icons, and active publishing permissions.
          </p>
        </div>

        <button class="btn btn-gold" onclick="openCreateModal()"><i class="fas fa-plus-circle"></i> Add New Category</button>
      </div>
    </div>
  </section>

  <div class="container" style="padding:40px 20px;">
    <!-- Create / Edit Modal -->
    <div id="cat-modal" class="card" style="display:none;padding:28px;margin-bottom:30px;border:2px solid var(--teal-600);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid #e2e8f0;padding-bottom:10px;">
        <h3 style="font-size:1.2rem;font-weight:700;color:var(--navy-900);" id="modal-heading">Create New Category</h3>
        <button class="btn btn-outline btn-sm" onclick="closeModal()">&times; Close</button>
      </div>

      <form id="cat-form">
        <input type="hidden" id="cat-edit-id">
        <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px;">
          <div class="form-group">
            <label class="form-label" for="cat-name">Category Name <span class="req">*</span></label>
            <input type="text" id="cat-name" class="form-control" placeholder="e.g. Leatherworking & Saddlery" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="cat-icon">FontAwesome Icon Class</label>
            <input type="text" id="cat-icon" class="form-control" placeholder="fa-shoe-prints" value="fa-tools">
          </div>

          <div class="form-group">
            <label class="form-label" for="cat-order">Display Order</label>
            <input type="number" id="cat-order" class="form-control" value="0">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="cat-desc">Domain Description</label>
          <textarea id="cat-desc" class="form-control" placeholder="Describe the practical scope and vocational application..."></textarea>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button type="submit" id="btn-save-cat" class="btn btn-teal">Save Category</button>
        </div>
      </form>
    </div>

    <!-- Categories List Table -->
    <div class="card">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Icon</th>
              <th>Category Name & Slug</th>
              <th>Description</th>
              <th>Published Records</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="categories-tbody">
            <tr><td colspan="6" style="text-align:center;padding:30px;"><i class="fas fa-spinner fa-spin"></i> Loading practical categories...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const meRes = await api.get('/auth/me');
        if (!meRes.authenticated || meRes.user.role !== 'admin') {
          api.toast('Category management is restricted to system administrators.', 'error');
          setTimeout(() => window.location.href = '/dashboard.html', 1000);
          return;
        }

        await loadCategories();
      } catch (err) {
        window.location.href = '/login.html';
      }
    });

    async function loadCategories() {
      const tbody = document.getElementById('categories-tbody');
      try {
        const res = await api.get('/categories?all=true');
        const cats = res.categories || [];

        tbody.innerHTML = cats.map(c => `
          <tr>
            <td style="font-size:1.4rem;color:var(--teal-600);"><i class="fas ${c.icon || 'fa-tools'}"></i></td>
            <td>
              <div style="font-weight:700;color:var(--navy-900);">${c.name}</div>
              <div style="font-size:0.75rem;color:var(--slate-500);font-family:monospace;">${c.slug}</div>
            </td>
            <td style="max-width:320px;font-size:0.85rem;color:var(--slate-600);">${c.description || '-'}</td>
            <td><strong>${c.published_records_count || 0}</strong></td>
            <td>
              <button class="btn btn-sm ${c.is_active ? 'btn-teal' : 'btn-outline'}" onclick="toggleActive(${c.id})" style="font-size:0.75rem;">
                ${c.is_active ? 'Active' : 'Deactivated'}
              </button>
            </td>
            <td>
              <button class="btn btn-outline btn-sm" onclick="openEditModal(${JSON.stringify(c).replace(/"/g, '&quot;')})">
                <i class="fas fa-edit"></i> Edit
              </button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" style="color:red;padding:20px;text-align:center;">${err.message}</td></tr>`;
      }
    }

    function openCreateModal() {
      document.getElementById('cat-edit-id').value = '';
      document.getElementById('modal-heading').textContent = 'Create New Practical Domain';
      document.getElementById('cat-form').reset();
      document.getElementById('cat-modal').style.display = 'block';
      document.getElementById('cat-modal').scrollIntoView({ behavior: 'smooth' });
    }

    function openEditModal(c) {
      document.getElementById('cat-edit-id').value = c.id;
      document.getElementById('modal-heading').textContent = `Edit Domain: ${c.name}`;
      document.getElementById('cat-name').value = c.name;
      document.getElementById('cat-icon').value = c.icon || 'fa-tools';
      document.getElementById('cat-order').value = c.display_order || 0;
      document.getElementById('cat-desc').value = c.description || '';
      document.getElementById('cat-modal').style.display = 'block';
      document.getElementById('cat-modal').scrollIntoView({ behavior: 'smooth' });
    }

    function closeModal() {
      document.getElementById('cat-modal').style.display = 'none';
    }

    async function toggleActive(id) {
      try {
        const res = await api.delete(`/categories/${id}`);
        api.toast(res.message, 'success');
        await loadCategories();
      } catch (err) {
        api.toast(err.message, 'error');
      }
    }

    document.getElementById('cat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('cat-edit-id').value;
      const body = {
        name: document.getElementById('cat-name').value.trim(),
        icon: document.getElementById('cat-icon').value.trim(),
        display_order: parseInt(document.getElementById('cat-order').value, 10) || 0,
        description: document.getElementById('cat-desc').value.trim()
      };

      try {
        if (id) {
          await api.put(`/categories/${id}`, body);
          api.toast('Category updated successfully.', 'success');
        } else {
          await api.post('/categories', body);
          api.toast('Category created successfully.', 'success');
        }
        closeModal();
        await loadCategories();
      } catch (err) {
        api.toast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
