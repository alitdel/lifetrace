<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile – LifeTrace Uganda</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color:var(--slate-50);">
  <div id="navbar-placeholder"></div>

  <div class="container" style="max-width:900px;padding:40px 20px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px;">
      <div>
        <h1 style="font-size:1.8rem;font-weight:800;color:var(--navy-900);">Account Profile Settings</h1>
        <p style="color:var(--slate-600);font-size:0.9rem;">Manage your public biographical information, vocational expertise, and security credentials.</p>
      </div>
      <a href="/dashboard.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <div style="display:grid;grid-template-columns:1fr 2fr;gap:30px;">
      <!-- Left Column: Avatar & Overview -->
      <div>
        <div class="card" style="padding:24px;text-align:center;margin-bottom:24px;">
          <div style="position:relative;width:120px;height:120px;margin:0 auto 16px;">
            <img id="avatar-img" src="/assets/avatars/admin.png" alt="Avatar" style="width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--teal-600);" onerror="this.src='/assets/avatars/admin.png'">
            <label for="avatar-file" style="position:absolute;bottom:0;right:0;background:var(--navy-900);color:white;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid white;" title="Upload new photo">
              <i class="fas fa-camera" style="font-size:0.85rem;"></i>
            </label>
            <input type="file" id="avatar-file" accept="image/jpeg,image/png,image/webp" style="display:none;" onchange="handleAvatarUpload(event)">
          </div>

          <h3 id="profile-name" style="font-size:1.2rem;font-weight:700;color:var(--navy-900);">-</h3>
          <div id="profile-role" class="badge" style="background:var(--teal-100);color:var(--teal-700);margin:6px 0 14px;">ROLE</div>
          <div id="profile-email" style="font-size:0.82rem;color:var(--slate-500);word-break:break-all;">-</div>
          <div id="profile-joined" style="font-size:0.75rem;color:var(--slate-400);margin-top:4px;">-</div>
        </div>

        <!-- Security: Change Password Card -->
        <div class="card" style="padding:24px;">
          <h4 style="font-size:1rem;font-weight:700;color:var(--navy-900);margin-bottom:14px;"><i class="fas fa-key" style="color:var(--gold-500);margin-right:6px;"></i> Change Password</h4>
          <form id="password-form">
            <div class="form-group">
              <label class="form-label" for="curr-pass">Current Password</label>
              <input type="password" id="curr-pass" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="new-pass">New Password</label>
              <input type="password" id="new-pass" class="form-control" required minlength="8">
            </div>
            <button type="submit" id="btn-save-pass" class="btn btn-outline btn-sm" style="width:100%;">Update Password</button>
          </form>
        </div>
      </div>

      <!-- Right Column: Profile Form -->
      <div>
        <div class="card" style="padding:30px;">
          <h3 style="font-size:1.2rem;font-weight:700;color:var(--navy-900);margin-bottom:20px;border-bottom:1px solid var(--slate-200);padding-bottom:10px;">
            <i class="fas fa-user-edit" style="color:var(--teal-600);margin-right:8px;"></i> Biographical & Professional Details
          </h3>

          <form id="profile-form">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
              <div class="form-group">
                <label class="form-label" for="edit-full-name">Full Name <span class="req">*</span></label>
                <input type="text" id="edit-full-name" class="form-control" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="edit-phone">Phone Number</label>
                <input type="tel" id="edit-phone" class="form-control" placeholder="+256 700 000 000">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-bio">Short Biography</label>
              <textarea id="edit-bio" class="form-control" placeholder="Provide background on your practical experience..."></textarea>
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-location">Location / District</label>
              <input type="text" id="edit-location" class="form-control" placeholder="e.g. Wakiso / Kampala, Uganda">
            </div>

            <!-- Expert-Only Dynamic Fields -->
            <div id="expert-specific-fields" style="display:none;background:var(--slate-50);padding:18px;border-radius:var(--radius-md);margin-bottom:20px;border:1px solid var(--slate-200);">
              <h4 style="font-size:0.95rem;font-weight:700;color:var(--teal-700);margin-bottom:12px;">Expertise & Credentials</h4>
              
              <div class="form-group">
                <label class="form-label" for="edit-areas">Areas of Expertise</label>
                <input type="text" id="edit-areas" class="form-control" placeholder="e.g. Gravity Drip Irrigation, Solar PV Systems">
              </div>

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label" for="edit-experience">Experience (Years)</label>
                  <input type="number" id="edit-experience" class="form-control" min="1" max="60">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label" for="edit-org">Organization / Trade</label>
                  <input type="text" id="edit-org" class="form-control">
                </div>
              </div>

              <div style="margin-top:14px;">
                <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;cursor:pointer;">
                  <input type="checkbox" id="edit-public-visible" style="accent-color:var(--teal-600);width:16px;height:16px;">
                  <span>Make my expert profile publicly visible in the LifeTrace Experts directory</span>
                </label>
              </div>
            </div>

            <!-- Learner-Only Dynamic Fields -->
            <div id="learner-specific-fields" style="display:none;background:var(--slate-50);padding:18px;border-radius:var(--radius-md);margin-bottom:20px;border:1px solid var(--slate-200);">
              <h4 style="font-size:0.95rem;font-weight:700;color:var(--indigo-600);margin-bottom:12px;">Learner Interests</h4>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label" for="edit-education">Education / Year</label>
                  <input type="text" id="edit-education" class="form-control" placeholder="e.g. Year 2 Student">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label" for="edit-interest">Primary Vocational Interest</label>
                  <input type="text" id="edit-interest" class="form-control">
                </div>
              </div>
            </div>

            <button type="submit" id="btn-save-profile" class="btn btn-teal btn-lg">
              <i class="fas fa-save"></i> Save Profile Changes
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let activeUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await api.get('/users/profile');
        if (!res.user) {
          window.location.href = '/login.html';
          return;
        }

        activeUser = res.user;
        const p = activeUser.profile || {};

        document.getElementById('avatar-img').src = activeUser.avatar_url || '/assets/avatars/admin.png';
        document.getElementById('profile-name').textContent = activeUser.full_name;
        document.getElementById('profile-role').textContent = activeUser.role.toUpperCase();
        document.getElementById('profile-email').textContent = activeUser.email;
        document.getElementById('profile-joined').textContent = `Member since ${new Date(activeUser.created_at).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' })}`;

        document.getElementById('edit-full-name').value = activeUser.full_name || '';
        document.getElementById('edit-phone').value = activeUser.phone || '';
        document.getElementById('edit-bio').value = p.bio || '';
        document.getElementById('edit-location').value = p.location || 'Uganda';

        if (activeUser.role === 'expert') {
          document.getElementById('expert-specific-fields').style.display = 'block';
          document.getElementById('edit-areas').value = p.areas_of_expertise || '';
          document.getElementById('edit-experience').value = p.experience_years || 1;
          document.getElementById('edit-org').value = p.organization_or_trade || '';
          document.getElementById('edit-public-visible').checked = p.public_profile_visible !== 0;
        } else if (activeUser.role === 'learner') {
          document.getElementById('learner-specific-fields').style.display = 'block';
          document.getElementById('edit-education').value = p.education_level || '';
          document.getElementById('edit-interest').value = p.primary_interest || '';
        }
      } catch (err) {
        window.location.href = '/login.html';
      }
    });

    async function handleAvatarUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('avatar', file);

      try {
        api.toast('Uploading avatar...', 'info');
        const res = await api.upload('/media/avatar', formData);
        document.getElementById('avatar-img').src = res.avatarUrl;
        api.toast('Avatar updated successfully!', 'success');
      } catch (err) {
        api.toast(err.message, 'error');
      }
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-save-profile');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

      const body = {
        full_name: document.getElementById('edit-full-name').value.trim(),
        phone: document.getElementById('edit-phone').value.trim(),
        bio: document.getElementById('edit-bio').value.trim(),
        location: document.getElementById('edit-location').value.trim()
      };

      if (activeUser.role === 'expert') {
        body.areas_of_expertise = document.getElementById('edit-areas').value.trim();
        body.experience_years = parseInt(document.getElementById('edit-experience').value, 10) || 1;
        body.organization_or_trade = document.getElementById('edit-org').value.trim();
        body.public_profile_visible = document.getElementById('edit-public-visible').checked ? 1 : 0;
      } else if (activeUser.role === 'learner') {
        body.education_level = document.getElementById('edit-education').value.trim();
        body.primary_interest = document.getElementById('edit-interest').value.trim();
      }

      try {
        await api.put('/users/profile', body);
        api.toast('Profile updated successfully!', 'success');
        document.getElementById('profile-name').textContent = body.full_name;
      } catch (err) {
        api.toast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Save Profile Changes';
      }
    });

    document.getElementById('password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const currentPassword = document.getElementById('curr-pass').value;
      const newPassword = document.getElementById('new-pass').value;
      const btn = document.getElementById('btn-save-pass');

      btn.disabled = true;
      try {
        await api.put('/auth/password', { currentPassword, newPassword });
        api.toast('Password changed successfully.', 'success');
        document.getElementById('password-form').reset();
      } catch (err) {
        api.toast(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
