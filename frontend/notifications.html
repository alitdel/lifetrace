<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications – LifeTrace Uganda</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color:var(--slate-50);">
  <div id="navbar-placeholder"></div>

  <!-- Header -->
  <section style="background:var(--navy-900);color:var(--white);padding:40px 0 30px;border-bottom:3px solid var(--teal-600);">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
      <div>
        <h1 style="font-size:2rem;font-weight:800;color:var(--white);">Notifications & Activity Alerts</h1>
        <p style="color:var(--slate-300);font-size:1rem;margin-top:4px;">
          Stay informed on review decisions, grading updates, and certificates.
        </p>
      </div>

      <button class="btn btn-outline-white btn-sm" onclick="markAllRead()">
        <i class="fas fa-check-double"></i> Mark All as Read
      </button>
    </div>
  </section>

  <div class="container" style="max-width:850px;padding:40px 20px;">
    <div class="card" style="padding:10px 0;" id="notifs-container">
      <div style="text-align:center;padding:50px 0;"><i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--teal-600);"></i></div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const auth = await api.get('/auth/me');
        if (!auth.authenticated) {
          window.location.href = '/login.html';
          return;
        }

        await loadNotifications();
      } catch (err) {
        window.location.href = '/login.html';
      }
    });

    async function loadNotifications() {
      const container = document.getElementById('notifs-container');
      try {
        const res = await api.get('/notifications');
        const notifs = res.notifications || [];

        if (notifs.length === 0) {
          container.innerHTML = `
            <div style="text-align:center;padding:50px 20px;color:#64748b;">
              <i class="far fa-bell" style="font-size:3rem;margin-bottom:12px;color:var(--slate-300);"></i>
              <h3>You're all caught up!</h3>
              <p style="font-size:0.9rem;margin-top:6px;">No new alerts at this time.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = notifs.map(n => {
          let icon = 'info-circle';
          let color = 'var(--teal-600)';
          if (n.type === 'success') { icon = 'check-circle'; color = 'var(--emerald-600)'; }
          if (n.type === 'warning') { icon = 'exclamation-circle'; color = 'var(--gold-600)'; }
          if (n.type === 'action_required') { icon = 'exclamation-triangle'; color = 'var(--rose-600)'; }

          return `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid #f1f5f9;background:${n.is_read ? 'transparent' : '#f0fdfa'};">
              <div style="display:flex;gap:16px;align-items:flex-start;">
                <i class="fas fa-${icon}" style="font-size:1.4rem;color:${color};margin-top:2px;"></i>
                <div>
                  <div style="font-weight:700;font-size:1rem;color:var(--navy-900);">${n.title}</div>
                  <p style="font-size:0.9rem;color:var(--slate-600);margin:4px 0 8px;">${n.message}</p>
                  <div style="font-size:0.75rem;color:var(--slate-400);">
                    ${new Date(n.created_at).toLocaleString('en-GB')}
                  </div>
                </div>
              </div>

              <div style="display:flex;gap:8px;align-items:center;">
                ${n.link ? `<a href="${n.link}" class="btn btn-teal btn-sm" onclick="markSingleRead(${n.id})">Open</a>` : ''}
                ${!n.is_read ? `<button class="btn btn-outline btn-sm" onclick="markSingleRead(${n.id})" title="Mark read"><i class="fas fa-check"></i></button>` : ''}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div style="padding:20px;color:red;text-align:center;">${err.message}</div>`;
      }
    }

    async function markSingleRead(id) {
      try {
        await api.put(`/notifications/${id}/read`);
        await loadNotifications();
        initNotificationBadge();
      } catch (err) {
        api.toast(err.message, 'error');
      }
    }

    async function markAllRead() {
      try {
        await api.put('/notifications/read-all');
        api.toast('All notifications marked as read.', 'success');
        await loadNotifications();
        initNotificationBadge();
      } catch (err) {
        api.toast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
